<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D.A.S.H | Mudar Palavra-Passe</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #0b0c10; font-family: 'Segoe UI', Tahoma, sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .cartao-login { background-color: #111217; border: 1px solid #00b4d8; border-radius: 12px; box-shadow: 0 8px 32px rgba(0, 180, 216, 0.2); width: 100%; max-width: 420px; padding: 2.5rem 2rem; }
        .titulo-dash { font-size: 1.5rem; color: #00b4d8; font-weight: bold; text-align: center; margin-bottom: 10px; }
        .sub-dash { font-size: 0.85rem; color: #8a8d93; text-align: center; margin-bottom: 2rem; }
        .form-control { background-color: #1e2026; border: 1px solid #2a2d35; color: #ffffff; padding: 0.75rem 1rem; border-radius: 6px; }
        .form-control:focus { background-color: #1e2026; border-color: #00b4d8; color: #ffffff; box-shadow: 0 0 8px rgba(0, 180, 216, 0.25); }
        .btn-entrar { background-color: #00b4d8; border: none; color: #0b0c10; font-weight: bold; letter-spacing: 1px; padding: 0.75rem; border-radius: 6px; text-transform: uppercase; transition: all 0.3s ease; }
        .btn-entrar:hover { background-color: #0077b6; color: #ffffff; }
        .form-label { color: #8a8d93; font-weight: 500; font-size: 0.9rem; }
    </style>
</head>
<body>

    <div class="cartao-login">
        <div class="titulo-dash">🔐 Ação Necessária</div>
        <div class="sub-dash">Bem-vindo, {{ session.get('nome_usuario') }}! Como este é o seu primeiro acesso (ou a sua senha foi redefinida), precisa de escolher uma nova palavra-passe segura.</div>

        {% if erro %}
        <div class="alert alert-danger py-2 text-center" style="font-size: 0.85rem; background-color: #842029; border: none; color: #f8d7da;">
            {{ erro }}
        </div>
        {% endif %}

        <form method="POST">
            <div class="mb-3">
                <label for="nova_senha" class="form-label">Nova Palavra-passe</label>
                <input type="password" class="form-control" id="nova_senha" name="nova_senha" required>
            </div>
            
            <div class="mb-4">
                <label for="confirmar_senha" class="form-label">Confirmar Palavra-passe</label>
                <input type="password" class="form-control" id="confirmar_senha" name="confirmar_senha" required>
            </div>

            <button type="submit" class="btn btn-entrar w-100 mb-2">Salvar Nova Palavra-passe</button>
        </form>
    </div>

</body>
</html>
